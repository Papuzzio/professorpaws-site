<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — Professor Paws</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32" />
<style>
  /* Brought in line with the other eight pages, 2026-08-27. This page previously carried its own
     brand: the mascot cropped into a 96px circle, and a CTA on --orange-deep where every section
     page uses --teal-deep. A 404 is a page a lost parent actually lands on, so it is not the place
     to be the one inconsistent surface. Same palette tokens, same approved logo, same button. */
  :root {
    --cream:#FFF8ED; --paper:#FFFCF7;
    --ink:#14213D; --ink-soft:#55607A;
    --orange:#F59A23; --orange-deep:#B4530A;
    --teal:#14AAA3; --teal-deep:#0F7A76;
    --green:#63A65F;
    /* Reached by NO build step — see check-brand-contrast.py rule 6. Must match index.html. */
    --action:var(--teal-deep); --action-hover:#0C6A66; --action-active:#0A5A57; --action-ink:#fff;
  }
  body { margin:0; background:var(--cream); color:var(--ink); font-family:system-ui, -apple-system, sans-serif; font-size:18px; line-height:1.65; display:grid; min-height:100vh; place-items:center; text-align:center; padding:22px; }
  /* The approved logo, not a cropped mascot. This is the ONE page with vertical room to spare, so it
     runs at 120px — the size at which the badge's wordmark (8.8% of its height) is actually legible
     at ~10.6px, rather than the emblem reading it necessarily has in the 72px header bar. */
  .brand { display:block; margin:0 auto 18px; width:123px; height:120px; }
  h1 { font-family:'Fraunces','Iowan Old Style','Palatino',Georgia,serif; font-weight:700; font-size:1.8rem; margin:0 0 8px; }
  p { margin:0 0 22px; color:var(--ink-soft); }
  a.home { display:inline-block; background:var(--action); color:var(--action-ink); text-decoration:none; font-family:system-ui,-apple-system,sans-serif; font-weight:700; padding:13px 28px; border-radius:999px; min-height:44px; box-sizing:border-box; }
  a.home:hover { background:var(--action-hover); }   /* was #0C6360 — a fourth teal nobody meant. Dropped, not ported. */
</style>
</head>
<body>
<main>
  <a href="/" aria-label="Professor Paws — home"><picture>
    <img class="brand" src="/assets/brand/wordmark.svg" width="200" height="24" alt="Professor Paws" />
  </picture></a>
  <h1>This page wandered off.</h1>
  <p>Let's head back home.</p>
  <a class="home" href="/">Back to Professor Paws</a>
</main>
</body>
</html>
